<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143e27" />
      <stop offset="60%" stop-color="#0c2517" />
      <stop offset="100%" stop-color="#08180f" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners (squircle / modern icon shape) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="4" />

  <!-- Warm morning sun symbolizing "Canto Alegre" (optimism, life, photosynthesis) -->
  <circle cx="345" cy="170" r="68" fill="url(#sunGrad)" opacity="0.95" />
  <circle cx="345" cy="170" r="88" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="6" stroke-dasharray="8 12" />

  <!-- Plant Stem / Broto -->
  <path d="M 256 420 Q 256 310 260 220" fill="none" stroke="url(#stemGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Left Main Botanical Leaf -->
  <path d="M 258 320 C 150 310 100 230 145 150 C 225 155 260 240 258 320 Z" fill="url(#leafGrad1)" />
  <path d="M 258 320 Q 200 240 145 150" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" />

  <!-- Right Sprout Leaf -->
  <path d="M 258 260 C 350 250 395 190 365 120 C 295 130 260 200 258 260 Z" fill="url(#leafGrad2)" />
  <path d="M 258 260 Q 315 200 365 120" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" />

  <!-- Morning Dew Drops -->
  <circle cx="210" cy="205" r="7" fill="#ffffff" opacity="0.85" />
  <circle cx="330" cy="180" r="5" fill="#ffffff" opacity="0.75" />

  <!-- Base soil pot arc -->
  <path d="M 176 420 Q 256 445 336 420" fill="none" stroke="#065f46" stroke-width="12" stroke-linecap="round" />
</svg>
